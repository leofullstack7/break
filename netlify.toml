[build]
  base    = "app"
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA ROUTING ──────────────────────────────────────────────────
# Todas las rutas de React Router van al index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Forzar HTTPS en el subdominio de administración (Netlify)
[[redirects]]
  from   = "http://administracion.hotelbreakmanizales.com/*"
  to     = "https://administracion.hotelbreakmanizales.com/:splat"
  status = 301
  force  = true

# ── HEADERS DE SEGURIDAD ─────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(self), microphone=(self), geolocation=(self), payment=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"
    # CSP — ajustar cuando se agreguen servicios externos (Analytics, etc.)
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co blob:; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'none'; object-src 'none';"
    Cross-Origin-Opener-Policy = "same-origin"

# Cache agresivo para assets con hash (Vite los hashea automáticamente)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sin cache para el Service Worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── CONTEXTOS DE DEPLOY ──────────────────────────────────────────
[context.production]
  environment = { NODE_ENV = "production", VITE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development", VITE_ENV = "preview" }

[context.branch-deploy]
  environment = { NODE_ENV = "development", VITE_ENV = "staging" }
